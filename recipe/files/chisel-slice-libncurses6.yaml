# ReadyStack slice definition: chisel-releases (ubuntu-24.04) has no slice for libncurses6, which MariaDB's client
# programs load. Cut from Ubuntu's own libncurses6 .deb, as every canonical slice is; the format and the paths follow
# chisel-releases' own library slices. Contents of libncurses6 6.4+20240113-1ubuntu2.2 (noble): libncurses, libform,
# libmenu and libpanel .so.6.4 with their .so.6 links; /usr/share/doc/libncurses6 is a link to libtinfo6's, so the
# copyright is libtinfo6's (libtinfo6_copyright).
package: libncurses6

essential:
  - libtinfo6_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libtinfo6_libs
    contents:
      /usr/lib/*-linux-*/libncurses.so.6*:
      /usr/lib/*-linux-*/libform.so.6*:
      /usr/lib/*-linux-*/libmenu.so.6*:
      /usr/lib/*-linux-*/libpanel.so.6*:
